# Ignore DNS servers in /etc/resolv.conf
no-resolv
no-poll

listen-address=192.168.125.11
bind-dynamic

dhcp-authoritative
dhcp-range=192.168.125.100,192.168.125.199,18h

# No default route.
dhcp-option=3

# Set a fixed address and hostname for certain machines.
dhcp-host=40:61:86:62:f0:61,192.168.125.51,seesaw
dhcp-host=00:e2:4c:68:09:37,192.168.125.52,slide
dhcp-host=84:69:93:cc:61:43,192.168.125.53,swings
dhcp-host=00:e0:4c:68:15:b0,192.168.125.54,zipline

# Add some DNS records.
no-hosts
host-record=seesaw,192.168.125.51,300
host-record=slide,192.168.125.52,300
host-record=swings,192.168.125.53,300
host-record=zipline,192.168.125.54,300

# Statically configured hosts.
host-record=lab-rtr,192.168.125.11,300

# Set tag "ipxe" when option 77 == "iPXE"
dhcp-userclass=set:ipxe,iPXE

# Default boot file
#dhcp-boot=tag:!ipxe,ipxe.efi
dhcp-boot=tag:!ipxe,ipxe.pxe

# For when ipxe.efi runs and sends its own DHCP request.
dhcp-boot=tag:ipxe,http://192.168.125.11/boot/debian/trixie/ipxe/www/boot.ipxe

enable-tftp
tftp-root=/srv/boot/debian/trixie/ipxe/tftp
